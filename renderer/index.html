<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>PrintPulse Agent v3</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- Credential Modal — shown when tracking printers that need web auth -->
  <div id="cred-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm mx-4">
      <h3 class="text-lg font-semibold text-slate-800 mb-1">Web UI Credentials</h3>
      <p class="text-sm text-slate-500 mb-4">
        Printer ini butuh login untuk baca data toner via web.<br>
        <span class="font-mono text-indigo-600" id="cred-ip"></span> — <span id="cred-merk" class="text-slate-600"></span>
      </p>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-medium text-slate-500">Username</label>
          <input id="cred-username" type="text" placeholder="admin" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-500">Password</label>
          <input id="cred-password" type="password" placeholder="••••" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <p id="cred-error" class="hidden text-xs text-red-500"></p>
      </div>
      <div class="flex gap-2 mt-5">
        <button onclick="window.skipCredModal()" class="flex-1 px-4 py-2 text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">Nanti Saja</button>
        <button onclick="window.submitCredModal()" class="flex-1 px-4 py-2 text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors font-medium">Simpan</button>
      </div>
    </div>
  </div>

  <!-- VIEWS CONTAINER -->
  <div id="app-root" class="flex-1 w-full h-full relative flex flex-col min-h-0"></div>

  <!-- CORE APP SCRIPTS -->
  <script src="js/app.js"></script>
  
  <!-- VIEW MODULES -->
  <script src="js/views/login.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/discovery.js"></script>

  <!-- Global credential modal handlers (unified via modal.dataset) -->
  <script>
    window.submitCredModal = function() {
      var modal = document.getElementById('cred-modal');
      var ip = modal.dataset.ip;
      if (!ip) return;
      var u = document.getElementById('cred-username').value;
      var p = document.getElementById('cred-password').value;
      var errEl = document.getElementById('cred-error');
      errEl.classList.add('hidden');
      var submitBtn = modal.querySelector('button:last-child');
      var origText = submitBtn.textContent;
      submitBtn.textContent = 'Verifikasi...';
      submitBtn.disabled = true;
      var ipc = require('electron').ipcRenderer;

      var finish = function(ok, msg) {
        submitBtn.textContent = origText;
        submitBtn.disabled = false;
        if (ok) {
          modal.classList.add('hidden');
          ipc.invoke('get-config').then(function(c) { if (app) app.config = c; });
          if (app && app.toast) app.toast(msg || '✓ Credentials verified untuk ' + ip);
        } else {
          errEl.textContent = '✗ ' + (msg || 'Login gagal — coba lagi');
          errEl.classList.remove('hidden');
        }
      };

      // mode 'track' = discovery (register device with creds), else 'verify' = update creds
      if (modal.dataset.mode === 'track') {
        var merk = modal.dataset.merk || '';
        var model = modal.dataset.model || '';
        var sn = modal.dataset.sn || '';
        ipc.invoke('track-device', {
          ip: ip, merk_detected: merk, model_detected: model,
          snmp_result: { sysName: sn },
          web_username: u, web_password: p, web_ssl: false
        }).then(function() {
          finish(true, '✓ Device ' + ip + ' ditrack');
        }).catch(function(e) {
          finish(false, (e && (e.message || e.error)) || 'Gagal menambahkan device');
        });
      } else {
        ipc.invoke('update-device-cred', ip, u, p).then(function(result) {
          if (result && result.ok) finish(true);
          else finish(false, (result && result.error) || 'Login gagal — coba lagi');
        }).catch(function(e) {
          finish(false, (e && e.message) || e);
        });
      }
    };

    window.skipCredModal = function() {
      var modal = document.getElementById('cred-modal');
      var ip = modal.dataset.ip;
      modal.classList.add('hidden');
      // mode 'track' = still register device, just without web creds
      if (ip && modal.dataset.mode === 'track') {
        var ipc = require('electron').ipcRenderer;
        ipc.invoke('track-device', {
          ip: ip,
          merk_detected: modal.dataset.merk || '',
          model_detected: modal.dataset.model || '',
          snmp_result: { sysName: modal.dataset.sn || '' },
          web_username: '', web_password: '', web_ssl: null
        }).then(function() {
          ipc.invoke('get-config').then(function(c) { if (app) app.config = c; });
          if (app && app.toast) app.toast('Device ' + ip + ' ditambahkan (tanpa web login)');
        }).catch(function(e) {
          if (app && app.toast) app.toast('Gagal: ' + ((e && (e.message || e.error)) || 'Unknown'), 'error');
        });
      }
    };
  </script>

  </body>
</html>
